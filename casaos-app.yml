services:
  airxplay2:
    container_name: airplay2
    image: "zima-airplay2:1.0"
    network_mode: host
    restart: unless-stopped
    pull_policy: never
    cap_add:
      - SYS_NICE
    # Without device access Shairport Sync exits with output_device_error_19.
    devices:
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - "c 116:* rwm"
    volumes:
      - /dev/snd:/dev/snd
      - /proc/asound:/host/asound:ro
      - /DATA/AppData/airplay2/data:/data
    environment:
      - PANEL_PORT=8090

x-casaos:
  title:
    custom: AirxPlay2
  main: airxplay2
  scheme: http
  hostname: 192.168.68.112
  port_map: "8090"
  index: /
  category: Media
  author: haboshehry
  developer: haboshehry
  architectures:
    - amd64
  description:
    custom: AirPlay 2 audio receiver with a bilingual web panel, CLI and sync delay.
  tagline:
    custom: AirPlay 2 receiver + control panel
  version: "1.0"
